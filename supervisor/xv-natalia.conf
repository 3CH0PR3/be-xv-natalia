[program:xv-natalia-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
directory=/var/www/xv-natalia/be-xv-natalia
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=5
redirect_stderr=true
stdout_logfile=/var/www/xv-natalia/be-xv-natalia/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60

[program:xv-natalia-reverb]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php artisan reverb:start --host=0.0.0.0 --port=8083
directory=/var/www/xv-natalia/be-xv-natalia
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/xv-natalia/be-xv-natalia/storage/logs/reverb.log
stopwaitsecs=3600
